<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;padding:0}.page{width:1280px;height:854px;display:flex}
.main{flex:0 0 75%;background:#080E1C;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:96px 96px}
.glow{position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 50%,rgba(0,102,255,.35) 0%,rgba(8,14,28,0) 70%)}
.mark{position:relative;height:420px}
.strip{flex:1;display:flex;flex-direction:column}.strip>div{flex:1}
</style></head><body>
<div class="page">
<div class="main"><div class="grid"></div><div class="glow"></div><img class="mark" src="assets/ks-logo-light.png" alt="KS Consulting"></div>
<div class="strip">
<div style="background:#BAFC04"></div>
<div style="background:#00D9FF"></div>
<div style="background:#20A4FF"></div>
<div style="background:#0066FF"></div>
</div>
</div></body></html>
