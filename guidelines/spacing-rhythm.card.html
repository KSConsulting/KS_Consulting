<!-- @dsCard group="Spacing" viewport="700x220" name="Section rhythm" subtitle="96px between sections, 24px grid gap, 1280px container" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-primary);font-family:var(--font-body);color:var(--text-secondary)}
.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:100px;border-radius:var(--radius-md);border:1px solid var(--border-soft);overflow:hidden}
.chip{height:64px}.meta{padding:8px 10px;font-size:11px;line-height:1.5}.n{color:var(--text-primary);font-weight:600;display:block}.v{color:var(--text-muted);font-family:var(--font-mono);font-size:10px}
.row{display:flex;align-items:baseline;gap:16px}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);min-width:96px}
</style></head><body><div style="border:1px dashed var(--border);border-radius:var(--radius-lg);padding:24px">
<div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px">01 — Seção</div>
<div style="font-family:var(--font-heading);font-size:24px;color:var(--text-primary);margin-bottom:24px">Título da seção</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px">
<div style="height:56px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-card)"></div><div style="height:56px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-card)"></div><div style="height:56px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-card)"></div>
</div>
<div style="height:96px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-muted);font-family:var(--font-mono)">96px — separação entre seções</div>
<div style="height:56px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-card)"></div>
</div></body></html>
