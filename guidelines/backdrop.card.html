<!-- @dsCard group="Brand" viewport="700x220" name="Background layers" subtitle="Ink base + hairline grid + radial glow — never flat #000" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg-primary)">
<div style="position:relative;height:220px;overflow:hidden;background:var(--bg-primary)">
<div style="position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px"></div>
<div style="position:absolute;inset:0;background-image:var(--backdrop-radial-blue),var(--backdrop-radial-cyan)"></div>
<div style="position:relative;padding:32px;font-family:var(--font-body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);display:flex;flex-direction:column;gap:10px">
<span>01 — base #080E1C</span><span>02 — grid rgba(255,255,255,.035) @ 56px</span><span>03 — radial azul</span><span>04 — radial ciano</span></div>
</div></body></html>
