<!-- @dsCard group="Spacing" viewport="700x180" name="Shadow & glow" subtitle="Discreet depth; glow only on the element that matters" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-primary);font-family:var(--font-body);color:var(--text-secondary)}
.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:100px;border-radius:var(--radius-md);border:1px solid var(--border-soft);overflow:hidden}
.chip{height:64px}.meta{padding:8px 10px;font-size:11px;line-height:1.5}.n{color:var(--text-primary);font-weight:600;display:block}.v{color:var(--text-muted);font-family:var(--font-mono);font-size:10px}
.row{display:flex;align-items:baseline;gap:16px}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);min-width:96px}
</style></head><body><div style="display:flex;gap:20px;padding:8px">
<div style="text-align:center;flex:1"><div style="height:80px;background:var(--surface-elevated);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-card)"></div><div style="margin-top:10px;font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">shadow-card</div></div><div style="text-align:center;flex:1"><div style="height:80px;background:var(--surface-elevated);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-card-elevated)"></div><div style="margin-top:10px;font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">shadow-card-elevated</div></div><div style="text-align:center;flex:1"><div style="height:80px;background:var(--surface-elevated);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--glow-blue-strong)"></div><div style="margin-top:10px;font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">glow-blue</div></div><div style="text-align:center;flex:1"><div style="height:80px;background:var(--surface-elevated);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--glow-green)"></div><div style="margin-top:10px;font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">glow-green</div></div>
</div></body></html>
