<!-- @dsCard group="Colors" viewport="700x140" name="Surfaces" subtitle="Backgrounds and card surfaces — never pure black" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-primary);font-family:var(--font-body);color:var(--text-secondary)}
.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:100px;border-radius:var(--radius-md);border:1px solid var(--border-soft);overflow:hidden}
.chip{height:64px}.meta{padding:8px 10px;font-size:11px;line-height:1.5}.n{color:var(--text-primary);font-weight:600;display:block}.v{color:var(--text-muted);font-family:var(--font-mono);font-size:10px}
.row{display:flex;align-items:baseline;gap:16px}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);min-width:96px}
</style></head><body><div class="g">
<div class="sw"><div class="chip" style="background:var(--bg-primary)"></div><div class="meta"><span class="n">bg-primary</span><span class="v">--bg-primary</span></div></div><div class="sw"><div class="chip" style="background:var(--bg-secondary)"></div><div class="meta"><span class="n">bg-secondary</span><span class="v">--bg-secondary</span></div></div><div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="meta"><span class="n">surface</span><span class="v">--surface</span></div></div><div class="sw"><div class="chip" style="background:var(--surface-elevated)"></div><div class="meta"><span class="n">surface-elevated</span><span class="v">--surface-elevated</span></div></div><div class="sw"><div class="chip" style="background:var(--border)"></div><div class="meta"><span class="n">border</span><span class="v">--border</span></div></div>
</div></body></html>
