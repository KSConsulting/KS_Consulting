<!-- @dsCard group="Colors" viewport="700x140" name="Semantic" subtitle="Status colours — neon doubles as success" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-primary);font-family:var(--font-body);color:var(--text-secondary)}
.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:100px;border-radius:var(--radius-md);border:1px solid var(--border-soft);overflow:hidden}
.chip{height:64px}.meta{padding:8px 10px;font-size:11px;line-height:1.5}.n{color:var(--text-primary);font-weight:600;display:block}.v{color:var(--text-muted);font-family:var(--font-mono);font-size:10px}
.row{display:flex;align-items:baseline;gap:16px}.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);min-width:96px}
</style></head><body><div class="g">
<div class="sw"><div class="chip" style="background:var(--success)"></div><div class="meta"><span class="n">success</span><span class="v">--success</span></div></div><div class="sw"><div class="chip" style="background:var(--info)"></div><div class="meta"><span class="n">info</span><span class="v">--info</span></div></div><div class="sw"><div class="chip" style="background:var(--warning)"></div><div class="meta"><span class="n">warning</span><span class="v">--warning</span></div></div><div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="meta"><span class="n">danger</span><span class="v">--danger</span></div></div>
</div></body></html>
