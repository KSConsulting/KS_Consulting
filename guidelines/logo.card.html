<!-- @dsCard group="Brand" viewport="700x260" name="Logo" subtitle="Marca KS Consulting — versões light, mono e sobre claro" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:24px;background:var(--bg-primary);font-family:var(--font-body)">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;align-items:end">
<div style="display:flex;flex-direction:column;gap:12px;align-items:center"><img src="../assets/ks-logo-light.png" alt="KS Consulting" style="height:130px"><span style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">logo-light</span></div>
<div style="display:flex;flex-direction:column;gap:12px;align-items:center"><img src="../assets/ks-mark-light.png" alt="KS" style="height:130px"><span style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">mark-light</span></div>
<div style="display:flex;flex-direction:column;gap:12px;align-items:center"><img src="../assets/ks-logo-mono-white.png" alt="KS Consulting" style="height:130px"><span style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">mono-white</span></div>
<div style="display:flex;flex-direction:column;gap:12px;align-items:center"><div style="background:var(--text-primary);border-radius:var(--radius-md);padding:12px;display:flex"><img src="../assets/ks-logo-dark.png" alt="KS Consulting" style="height:106px"></div><span style="font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">logo-dark / fundo claro</span></div>
</div>
</body></html>
